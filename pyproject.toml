[project]
name = "supervision-ms-ia"
version = "0.1.0"
description = "Servicio de IA de la plataforma de supervisión de obras: modelo de lectura para reportes (CQRS), predicciones y agentes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3",
    "alembic>=1",
    "pymongo>=4",
    "aio-pika>=10",
    "pyjwt[crypto]>=2",
    "apscheduler>=3,<4",
    # zoneinfo necesita la base de zonas horarias en Windows y en imágenes mínimas.
    "tzdata",
]

[project.scripts]
ia-api = "ia.main:ejecutar"
ia-worker = "ia.worker:ejecutar"
ia-carga-inicial = "ia.carga_inicial:ejecutar"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "testcontainers[postgres]>=4",
    "ruff",
    "mypy",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ia"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integracion: necesita PostgreSQL real (Testcontainers o IA_PRUEBAS_DB_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ia"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "apscheduler.*", "testcontainers.*"]
ignore_missing_imports = true
